name: Build Screen Overlay APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    # 直接通过 wrapper 命令强行下载并指定 8.1.1 版本，避开所有云端缓存冲突
    - name: Force Gradle 8.1.1
      run: |
        wget https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
        unzip -q gradle-8.1.1-bin.zip
        echo "$PWD/gradle-8.1.1/bin" >> $GITHUB_PATH

    - name: Build with Gradle
      run: gradle assembleDebug
      
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: ScreenOverlay-APK
        path: app/build/outputs/apk/debug/app-debug.apk
